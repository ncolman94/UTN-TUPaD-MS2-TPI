# Integracion continua: compila, ejecuta todas las pruebas (incluida la de
# caracterizacion contra la version inicial), mide cobertura y corre PMD.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y ejecutar pruebas con cobertura
        run: ./mvnw -B verify

      - name: Analisis estatico (PMD)
        run: ./mvnw -B pmd:pmd

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/reports/pmd.html
            target/pmd.xml
            target/caracterizacion/
